# =============================================================================
# Déploiement des Sens d'Estelle vers l'hébergement Infomaniak (FTPS)
#
# À chaque push sur « main » : installation, build, puis envoi du contenu de
# dist/ vers la racine web d'Infomaniak par FTPS.
#
# ⚠️ AVANT LA PREMIÈRE UTILISATION
#   1. Déployer une fois À LA MAIN (voir README) pour vérifier le bon dossier.
#      Un premier déploiement automatique vers le mauvais dossier est l'erreur
#      classique — et difficile à diagnostiquer.
#   2. Créer les secrets du dépôt (Settings → Secrets and variables → Actions) :
#        FTP_SERVER    ex. ftp.infomaniak.com
#        FTP_USERNAME  l'identifiant FTP du compte d'hébergement
#        FTP_PASSWORD  le mot de passe FTP
#        FTP_ROOT      le chemin du dossier web VÉRIFIÉ dans le gestionnaire de
#                      fichiers Infomaniak (souvent « /web/ » ou « / »)
#   3. Ne jamais écrire ces valeurs dans ce fichier : uniquement dans les Secrets.
# =============================================================================

name: Déploiement

on:
  push:
    branches: [main]
  # Lancement manuel depuis l'onglet Actions. Par défaut en simulation :
  # l'action se connecte, compare, affiche ce qu'elle enverrait — et n'écrit
  # rien. C'est le moyen de vérifier identifiants et dossier cible sans risquer
  # de déposer le site au mauvais endroit.
  workflow_dispatch:
    inputs:
      simulation:
        description: 'Simulation (aucun fichier transféré)'
        type: boolean
        default: true

# Un seul déploiement à la fois ; on annule un déploiement en cours si un
# nouveau push arrive.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Envoyer dist/ vers Infomaniak (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_ROOT }}
          # Journal des fichiers déjà déployés : les envois suivants ne
          # transfèrent que ce qui a changé.
          state-name: .ftp-deploy-sync-state.json
          # Ne jamais toucher aux fichiers hors du site (ex. dossiers e-mail,
          # bases, autres applications hébergées sur le même compte).
          dangerous-clean-slate: false
          # Vrai uniquement pour un lancement manuel coché « Simulation » ;
          # un push sur main déploie pour de bon.
          dry-run: ${{ inputs.simulation || false }}
