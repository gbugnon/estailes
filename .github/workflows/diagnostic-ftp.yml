# =============================================================================
# Diagnostic temporaire : que parle réellement le serveur d'Infomaniak ?
#
# Le déploiement échoue sur « 500 This security scheme is not implemented »,
# réponse du serveur à la commande AUTH TLS. Ce workflow sonde le serveur sans
# jamais s'authentifier : aucune donnée d'identification n'est utilisée, seul
# le nom d'hôte est lu (et masqué par GitHub dans les journaux).
#
# À supprimer une fois le protocole de déploiement tranché.
# =============================================================================

name: Diagnostic FTP

on: workflow_dispatch

jobs:
  sonder:
    runs-on: ubuntu-latest
    steps:
      - name: Bannière et réponse à AUTH TLS (port 21)
        env:
          HOTE: ${{ secrets.FTP_SERVER }}
        run: |
          (printf 'AUTH TLS\r\n'; sleep 4; printf 'QUIT\r\n') \
            | timeout 20 nc "$HOTE" 21 || echo "(pas de réponse sur le port 21)"

      - name: Ports ouverts
        env:
          HOTE: ${{ secrets.FTP_SERVER }}
        run: |
          for port in 21 22 990; do
            if timeout 8 bash -c "</dev/tcp/$HOTE/$port" 2>/dev/null; then
              echo "port $port : ouvert"
            else
              echo "port $port : fermé ou filtré"
            fi
          done
