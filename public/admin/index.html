<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Administration — Les sens d’Estelle</title>
  </head>
  <body>
    <!--
      Interface d'édition Sveltia CMS.

      Sveltia lit public/admin/config.yml, se connecte au dépôt GitHub, et
      écrit directement les fichiers Markdown / JSON de src/content/. Aucune
      base de données, aucun serveur : l'édition passe par des commits Git,
      et le déploiement se relance tout seul.

      On charge la dernière version stable de Sveltia. Pour figer une version
      précise (recommandé une fois le site en production, afin qu'une mise à
      jour distante ne casse jamais l'interface sans prévenir), remplacer par :
        https://unpkg.com/@sveltia/cms@<version>/dist/sveltia-cms.js
      en relevant le numéro publié sur https://github.com/sveltia/sveltia-cms
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
</html>
